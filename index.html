<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phylogenetic Tree Builder - NJ & UPGMA</title>
  <script src="https://unpkg.com/@phylocanvas/phylocanvas.gl@latest/dist/bundle.min.js"></script>
  <style>
    :root { --bg:#0b1020; --panel:#121a33; --muted:#9fb0d0; --text:#e7ecff; --accent:#84a9ff; }
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .container{max-width:1100px;margin:0 auto;padding:24px}
    h1{font-size:24px;margin:0 0 12px}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media (min-width: 960px){ .grid{grid-template-columns: 480px 1fr} }
    .card{background:var(--panel);border:1px solid #1e2a57;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,0.35);}
    .card h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid #1e2a57;color:#cfe0ff}
    .card .content{padding:14px}
    textarea{width:100%;min-height:260px;resize:vertical;background:#0c1430;color:var(--text);border:1px solid #223067;border-radius:10px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    label{display:inline-flex;align-items:center;gap:8px;color:#cfe0ff}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    select, input[type="number"], input[type="text"]{background:#0c1430;color:var(--text);border:1px solid #223067;border-radius:10px;padding:8px}
    button{background:linear-gradient(180deg,#8cb0ff,#789cff);border:none;color:#071230;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    button.secondary{background:#1a264f;color:#cfe0ff;border:1px solid #2b3d7a}
    .muted{color:var(--muted);font-size:12px}
    .error{background:#2a1230;border:1px solid #7a2b6b;color:#ffd7f1;padding:10px;border-radius:10px;margin-top:10px;white-space:pre-wrap}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #223067;padding:6px 8px;text-align:right}
    th{background:#0c1430;text-align:center}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .tag{display:inline-block;background:#1a264f;border:1px solid #2b3d7a;border-radius:999px;padding:2px 8px;font-size:12px}
    #phylocanvas-container{position:relative;overflow:hidden}
    .footer{color:#9fb0d0;font-size:12px;margin-top:8px}
    .copy-input{width:100%;background:#0c1430;color:var(--text);border:1px solid #223067;border-radius:10px;padding:8px}
    .ok{color:#86efac}
    .bad{color:#fca5a5}
    :root{--ok:#86efac;--bad:#fca5a5}
  </style>
</head>
<body>
  <div class="container">
        <h1>Phylogenetic Tree Additivity Diagnostics</h1>
    <div class="grid">
      <div class="card">
        <h2>Input alignment (FASTA)</h2>
        <div class="content">
          <textarea id="fasta"></textarea>
          <div class="row" style="margin-top:10px">
              <label><input type="radio" name="model" value="snp" checked> SNP distance</label>
            <label><input type="radio" name="model" value="p"> p-distance</label>
            <label><input type="radio" name="model" value="k2p"> Kimura 2-parameter</label>
          </div>
          <div class="row" style="margin-top:6px">
            <label>Handle gaps: 
              <select id="gapMode">
                <option value="pairwise-exclude" selected>Pairwise exclude gap or N sites</option>
                <option value="treat-mismatch">Treat gaps and N as mismatches</option>
              </select>
            </label>
            <label>Tree method:
              <select id="treeMethod">
                <option value="nj" selected>Neighbor-Joining (NJ)</option>
                <option value="upgma">UPGMA</option>
              </select>
            </label>
            <label>Decimals: <input type="number" id="decimals" value="5" min="2" max="10" step="1"></label>
          </div>
          <div class="row" style="margin-top:8px">
            <label><input type="checkbox" id="chkLabels" checked> Label branch lengths on tree</label>
            <label><input type="checkbox" id="chkResiduals" checked> Compute additivity diagnostics</label>
            <label>Tolerance (ε): <input type="number" id="tol" value="1e-6" step="1e-6"></label>
          </div>
          <div class="row" style="margin-top:10px">
            <button id="btnRun">Build Tree</button>
            <button id="btnExample" class="secondary">Load example</button>
            <button id="btnUpload" class="secondary">Upload file</button>
            <button id="btnDownload" class="secondary">Download Newick</button>
            <button id="btnSelfTest" class="secondary">Run self tests</button>
            <input type="file" id="fileInput" style="display:none">
          </div>
          <div class="footer">This runs fully in your browser. No data leaves your machine.</div>
          <div id="err" class="error" style="display:none"></div>
        </div>
      </div>
      <div class="card">
        <h2>Outputs</h2>
        <div class="content">
          <div class="flex">
            <span class="tag" id="tagN">Taxa: 0</span>
            <span class="tag" id="tagL">Length: 0</span>
            <span class="tag" id="tagModel">Model: p</span>
          </div>
          <h3 class="muted">Additivity diagnostics</h3>
          <div id="diag"></div>
          <div style="height:10px"></div>
          <h3 class="muted">Tree</h3>
          <div id="phylocanvas-container" style="width:100%;height:600px;background:#0b112a;border:1px solid #223067;border-radius:12px;"></div>
          <div style="height:10px"></div>
          <h3 class="muted">Newick</h3>
          <input id="newick" class="copy-input mono" readonly>
          <div style="height:10px"></div>
          <h3 class="muted">Distance matrix</h3>
          <div id="matrix"></div>
          <div style="height:10px"></div>
          <h3 class="muted">Self test results</h3>
          <div id="tests" class="mono"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const fastaEl = document.getElementById('fasta');
  const errEl = document.getElementById('err');
  const newickEl = document.getElementById('newick');
  const matrixEl = document.getElementById('matrix');
  const diagEl = document.getElementById('diag');
  const testsEl = document.getElementById('tests');
  const gapModeEl = document.getElementById('gapMode');
  const treeMethodEl = document.getElementById('treeMethod');
  const decimalsEl = document.getElementById('decimals');
  const tagN = document.getElementById('tagN');
  const tagL = document.getElementById('tagL');
  const tagModel = document.getElementById('tagModel');
  const chkLabels = document.getElementById('chkLabels');
  const chkResiduals = document.getElementById('chkResiduals');
  const tolEl = document.getElementById('tol');
  const phylocanvasContainer = document.getElementById('phylocanvas-container');

  // Example alignment with small differences
  const exampleFASTA = `>A\nACGTACGTACGT\n>B\nACGTAC-TACTT\n>C\nACGTACTTACGT\n>D\nACGTACGTTCGT\n`;

  document.getElementById('btnExample').addEventListener('click', () => {
    fastaEl.value = exampleFASTA;
    errEl.style.display = 'none';
    newickEl.value = '';
    matrixEl.replaceChildren();
    diagEl.replaceChildren();
    testsEl.replaceChildren();
    clearTreeViz();
  });

  document.getElementById('btnDownload').addEventListener('click', () => {
    if (!newickEl.value) return;
    const blob = new Blob([newickEl.value + "\n"], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tree.nwk';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnRun').addEventListener('click', () => {
    try { run(); } catch(e){
      showError('Unexpected error: ' + e.message);
      console.error(e);
    }
  });

  document.getElementById('btnSelfTest').addEventListener('click', () => {
    try { runSelfTests(); } catch(e){
      testsEl.textContent = 'Self tests crashed: ' + e.message;
      console.error(e);
    }
  });

  document.getElementById('btnUpload').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        fastaEl.value = event.target.result;
        clearError();
        newickEl.value = '';
        matrixEl.replaceChildren();
        diagEl.replaceChildren();
        testsEl.replaceChildren();
        clearTreeViz();
        
        // Show success message briefly
        const originalPlaceholder = fastaEl.placeholder;
        fastaEl.placeholder = `✓ Loaded ${file.name}`;
        setTimeout(() => {
          fastaEl.placeholder = originalPlaceholder;
        }, 3000);
      } catch (error) {
        showError('Error reading file: ' + error.message);
      }
    };
    
    reader.onerror = () => {
      showError('Error reading file. Please try again.');
    };
    
    reader.readAsText(file);
    
    // Clear the input so the same file can be selected again
    e.target.value = '';
  });

  let currentTree = null; // Store current Phylocanvas tree instance

  function showError(msg){
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
  function clearError(){ errEl.style.display = 'none'; errEl.textContent = ''; }

  function run(){
    clearError();
    matrixEl.replaceChildren();
    diagEl.replaceChildren();
    testsEl.replaceChildren();
    clearTreeViz();

    const raw = fastaEl.value.trim();
    if (!raw){ showError('Please paste a FASTA alignment.'); return; }

    const {labels, seqs} = parseFasta(raw);
    if (labels.length < 3){ showError('Need at least 3 sequences for NJ.'); return; }

    // Validate equal lengths
    const L = seqs[0].length;
    for (const s of seqs){ if (s.length !== L){ showError('All sequences must have the same length. Found lengths like ' + L + ' and ' + s.length + '.'); return; } }

    const model = document.querySelector('input[name="model"]:checked').value;
    const modelNames = { 'p': 'p-distance', 'k2p': 'Kimura 2P', 'snp': 'SNP distance' };
    tagModel.textContent = 'Model: ' + (modelNames[model] || model);
    tagN.textContent = 'Taxa: ' + labels.length;
    tagL.textContent = 'Length: ' + L;

    const {D} = computeDistanceMatrix(labels, seqs, { model, gapMode: gapModeEl.value });
    renderMatrix(labels, D);

    // Tree construction
    const treeMethod = treeMethodEl.value;
    let tree;
    if (treeMethod === 'upgma') {
      tree = upgma(D, labels.slice());
    } else {
      tree = neighborJoining(D, labels.slice());
    }
    const rooted = tree;

    const newick = toNewick(rooted, Number(decimalsEl.value));
    newickEl.value = newick;

    drawTree(rooted, newick);

    if (chkResiduals.checked){
      const Dp = computePatristicMatrix(rooted, labels);
      const res = compareMatrices(D, Dp);
      const quartet = quartetDiagnostics(D, labels, Number(tolEl.value));
      renderDiagnostics(res, quartet, labels);
    }
  }

  // Parse FASTA - tolerant of spaces and case
  function parseFasta(text){
    const lines = text.split(/\r?\n/);
    const labels = [];
    const seqs = [];
    let curr = '';
    for (let i=0;i<lines.length;i++){
      const line = lines[i].trim();
      if (!line) continue;
      if (line.startsWith('>')){
        labels.push(line.substring(1).trim() || ('taxon_' + labels.length));
        if (curr){ seqs.push(curr); curr = ''; }
      } else {
        curr += line.replace(/\s+/g, '').toUpperCase();
      }
    }
    if (curr) seqs.push(curr);
    if (labels.length !== seqs.length) throw new Error('FASTA parse error. Each ">" header must be followed by a sequence.');
    return {labels, seqs};
  }

  // Compute distance matrix using p-distance or K2P
  function computeDistanceMatrix(labels, seqs, opts){
    const n = labels.length;
    const D = Array.from({length:n}, () => Array(n).fill(0));
    const isGapN = (c) => c === '-' || c === 'N' || c === 'X' || c === '?';
    const transitions = new Set(['AG','GA','CT','TC']);

    for (let i=0;i<n;i++){
      for (let j=i+1;j<n;j++){
        let comp=0, mism=0, P=0, Q=0; // P transitions, Q transversions
        const a = seqs[i], b = seqs[j];
        for (let k=0;k<a.length;k++){
          const ai = a[k], bj = b[k];
          if (opts.gapMode === 'pairwise-exclude' && (isGapN(ai) || isGapN(bj))) continue;
          comp++;
          if (ai === bj) continue;
          if (opts.model === 'k2p'){
            const pair = ai + bj;
            const valid = 'ACGT'.includes(ai) && 'ACGT'.includes(bj);
            if (!valid){ mism++; continue; }
            if (transitions.has(pair)) P++; else Q++;
          } else {
            mism++;
          }
        }
        let dist = 0;
        if (comp === 0){ dist = 0; } else if (opts.model === 'k2p'){
          const p = P/comp, q = Q/comp;
          const t1 = 1 - 2*p - q;
          const t2 = 1 - 2*q;
          if (t1 <= 0 || t2 <= 0){
            dist = Infinity; // saturated
          } else {
            dist = -0.5*Math.log(t1) - 0.25*Math.log(t2);
          }
        } else if (opts.model === 'snp'){
          dist = mism; // Raw SNP count
        } else {
          dist = mism/comp;
        }
        if (opts.model === 'k2p' && !isFinite(dist)) dist = 3.0; // clamp if needed
        D[i][j] = D[j][i] = dist;
      }
    }
    return {D};
  }

  // Neighbor Joining implementation - returns a rooted binary tree object
  function neighborJoining(Dinit, labelsInit){
    // Work on copies
    let D = Dinit.map(row => row.slice());
    let labels = labelsInit.slice();
    const nodes = new Map(); // label -> node
    for (const name of labels){ nodes.set(name, { name, children: [] }); }

    while (labels.length > 2){
      const n = labels.length;
      // r sums
      const r = Object.create(null);
      for (let i=0;i<n;i++){
        let sum = 0; for (let j=0;j<n;j++) if (i!==j) sum += D[i][j];
        r[i] = sum;
      }
      // Build Q and find min
      let minVal = Infinity, mini = -1, minj = -1;
      for (let i=0;i<n;i++){
        for (let j=i+1;j<n;j++){
          const q = (n-2)*D[i][j] - r[i] - r[j];
          if (q < minVal){ minVal = q; mini = i; minj = j; }
        }
      }
      const i = mini, j = minj;
      const nameI = labels[i], nameJ = labels[j];

      // Limb lengths
      const Li = 0.5*D[i][j] + (r[i] - r[j])/(2*(n-2));
      const Lj = D[i][j] - Li;

      // Create new node U
      const uName = nameI + '_' + nameJ + '#' + (Math.random().toString(36).slice(2,7));
      const uNode = { name: uName, children: [ {node: nodes.get(nameI), length: Math.max(Li,0)}, {node: nodes.get(nameJ), length: Math.max(Lj,0)} ] };
      nodes.set(uName, uNode);

      // Build new D with u
      const newLabels = [];
      const mapOldToNew = new Map();
      for (let idx=0; idx<labels.length; idx++) if (idx!==i && idx!==j){
        newLabels.push(labels[idx]);
        mapOldToNew.set(idx, newLabels.length-1);
      }
      newLabels.push(uName);

      const m = newLabels.length;
      const D2 = Array.from({length:m}, () => Array(m).fill(0));
      // Copy old distances for survivors
      for (let a=0;a<labels.length;a++){
        if (a===i || a===j) continue;
        for (let b=a+1;b<labels.length;b++){
          if (b===i || b===j) continue;
          const A = mapOldToNew.get(a), B = mapOldToNew.get(b);
          D2[A][B] = D2[B][A] = D[a][b];
        }
      }
      // Distances from u to others
      for (let a=0;a<labels.length;a++){
        if (a===i || a===j) continue;
        const A = mapOldToNew.get(a);
        const d = 0.5*(D[i][a] + D[j][a] - D[i][j]);
        D2[A][m-1] = D2[m-1][A] = d;
      }

      labels = newLabels;
      D = D2;
    }

    // Final join to root
    const aName = labels[0], bName = labels[1];
    const aNode = nodes.get(aName), bNode = nodes.get(bName);
    const dist = D[0][1];
    const root = { name: 'root', children: [ {node:aNode, length: dist/2}, {node:bNode, length: dist/2} ] };
    return root;
  }

  // UPGMA implementation - assumes molecular clock (ultrametric tree)
  function upgma(Dinit, labelsInit) {
    // Work on copies
    let D = Dinit.map(row => row.slice());
    let labels = labelsInit.slice();
    const nodes = new Map(); // label -> node
    const clusterSizes = new Map(); // cluster -> number of sequences
    
    // Initialize leaf nodes and cluster sizes
    for (const name of labels) { 
      nodes.set(name, { name, children: [] });
      clusterSizes.set(name, 1);
    }

    while (labels.length > 1) {
      const n = labels.length;
      
      // Find minimum distance
      let minDist = Infinity, mini = -1, minj = -1;
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          if (D[i][j] < minDist) {
            minDist = D[i][j];
            mini = i;
            minj = j;
          }
        }
      }
      
      const i = mini, j = minj;
      const nameI = labels[i], nameJ = labels[j];
      
      // Branch lengths from new node to each child (half the distance)
      const branchLength = minDist / 2;
      
      // Create new internal node
      const uName = nameI + '_' + nameJ + '#' + (Math.random().toString(36).slice(2,7));
      const uNode = { 
        name: uName, 
        children: [
          { node: nodes.get(nameI), length: branchLength },
          { node: nodes.get(nameJ), length: branchLength }
        ] 
      };
      nodes.set(uName, uNode);
      
      // Update cluster size
      const newSize = clusterSizes.get(nameI) + clusterSizes.get(nameJ);
      clusterSizes.set(uName, newSize);
      
      // Build new distance matrix with UPGMA averaging
      const newLabels = [];
      const mapOldToNew = new Map();
      for (let idx = 0; idx < labels.length; idx++) {
        if (idx !== i && idx !== j) {
          newLabels.push(labels[idx]);
          mapOldToNew.set(idx, newLabels.length - 1);
        }
      }
      newLabels.push(uName);
      
      const m = newLabels.length;
      const D2 = Array.from({length: m}, () => Array(m).fill(0));
      
      // Copy distances between surviving clusters
      for (let a = 0; a < labels.length; a++) {
        if (a === i || a === j) continue;
        for (let b = a + 1; b < labels.length; b++) {
          if (b === i || b === j) continue;
          const A = mapOldToNew.get(a), B = mapOldToNew.get(b);
          D2[A][B] = D2[B][A] = D[a][b];
        }
      }
      
      // Calculate distances from new cluster to others using UPGMA formula
      for (let a = 0; a < labels.length; a++) {
        if (a === i || a === j) continue;
        const A = mapOldToNew.get(a);
        const sizeI = clusterSizes.get(nameI);
        const sizeJ = clusterSizes.get(nameJ);
        const sizeTotal = sizeI + sizeJ;
        
        // UPGMA distance: weighted average by cluster sizes
        const d = (sizeI * D[i][a] + sizeJ * D[j][a]) / sizeTotal;
        D2[A][m-1] = D2[m-1][A] = d;
      }
      
      labels = newLabels;
      D = D2;
      
      // Clean up old cluster sizes
      clusterSizes.delete(nameI);
      clusterSizes.delete(nameJ);
    }
    
    // Return the final root node
    return nodes.get(labels[0]);
  }

  // Newick export
  function toNewick(node, decimals=5){
    function fmt(x){ return Number(x).toFixed(decimals).replace(/0+$/,'').replace(/\.$/,''); }
    function esc(name){ return name.replace(/[\s:,()\[\]']/g, '_'); }
    function walk(n){
      if (!n.children || n.children.length===0){ return esc(n.name); }
      const parts = n.children.map(ch => {
        const sub = walk(ch.node);
        return sub + ':' + fmt(ch.length);
      });
      return '(' + parts.join(',') + ')';
    }
    // For the synthetic root, attach a trailing semicolon and include branch lengths
    if (node.name === 'root'){
      const parts = node.children.map(ch => walk(ch.node) + ':' + Number(ch.length).toFixed(decimals));
      return '(' + parts.join(',') + ')root;';
    }
    return walk(node) + ';'
  }

  // Phylocanvas tree rendering
  function drawTree(root, newick) {
    // Clear any existing tree
    phylocanvasContainer.innerHTML = '';
    
    if (typeof phylocanvas === 'undefined') {
      phylocanvasContainer.innerHTML = '<p style="color: var(--muted); padding: 20px; text-align: center;">Phylocanvas library not loaded</p>';
      return;
    }

    try {
      currentTree = new phylocanvas.PhylocanvasGL(
        phylocanvasContainer,
        {
          size: { width: phylocanvasContainer.offsetWidth, height: 600 },
          source: newick,
          type: phylocanvas.TreeTypes.Rectangular,
          showLabels: true,
          showBranchLengths: chkLabels.checked,
          interactive: true,
          padding: 40,
          strokeColour: '#ecf0f1',
          fillColour: '#84a9ff',
          fontColour: '#e7ecff',
          showLeafLabels: true, 
        }
      );
    } catch (error) {
      console.error('Phylocanvas error:', error);
      phylocanvasContainer.innerHTML = `<p style="color: var(--muted); padding: 20px; text-align: center;">Error rendering tree: ${error.message}</p>`;
    }
  }



  // Utility to collect leaves
  function getLeaves(root){
    const leaves = [];
    (function collect(n){
      if (!n.children || n.children.length===0){ leaves.push(n); return; }
      for (const ch of n.children) collect(ch.node);
    })(root);
    return leaves;
  }

  function clearTreeViz(){
    phylocanvasContainer.innerHTML = '';
  }

  function renderMatrix(labels, D){
    const model = document.querySelector('input[name="model"]:checked').value;
    const tbl = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    hr.appendChild(document.createElement('th'));
    
    // Only show column headers up to the current row (triangular)
    for (let j = 0; j < labels.length; j++){
      const th = document.createElement('th'); 
      th.textContent = labels[j]; 
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    tbl.appendChild(thead);

    const tb = document.createElement('tbody');
    for (let i = 0; i < labels.length; i++){
      const tr = document.createElement('tr');
      const th = document.createElement('th'); 
      th.textContent = labels[i]; 
      tr.appendChild(th);
      
      // Lower triangular matrix: only show j <= i
      for (let j = 0; j <= i; j++){
        const td = document.createElement('td');
        const v = D[i][j];
        
        if (i === j) {
          td.textContent = '0';
          td.style.backgroundColor = '#1a264f';
          td.style.fontWeight = 'bold';
        } else if (!Number.isFinite(v)) {
          td.textContent = 'Inf';
          td.style.color = '#fca5a5';
        } else {
          // Show integers for SNP distances, decimals for others
          td.textContent = model === 'snp' ? Math.round(v).toString() : v.toFixed(5);
        }
        tr.appendChild(td);
      }
      
      // Add empty cells for upper triangle to maintain table structure
      for (let j = i + 1; j < labels.length; j++){
        const td = document.createElement('td');
        td.style.backgroundColor = '#0b1020';
        td.style.border = 'none';
        tr.appendChild(td);
      }
      
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);
    matrixEl.replaceChildren(tbl);
  }

  // === Additivity diagnostics ===
  function computePatristicMatrix(root, leafNames){
    // Build parent pointers and depths from root
    const parents = new Map();
    const depths = new Map(); // node -> distance from root
    (function dfs(n, d){
      depths.set(n, d);
      if (!n.children || n.children.length===0) return;
      for (const ch of n.children){
        parents.set(ch.node, n);
        dfs(ch.node, d + ch.length);
      }
    })(root, 0);

    // Collect all leaves from the tree
    const allLeaves = [];
    (function collect(n){
      if (!n.children || n.children.length===0){ allLeaves.push(n); return; }
      for (const ch of n.children) collect(ch.node);
    })(root);

    // Helper to find LCA depth given two leaves
    function lcaDepth(a, b){
      const seen = new Set();
      let x = a;
      while (x){ seen.add(x); x = parents.get(x) || null; }
      let y = b;
      while (y){ if (seen.has(y)) return depths.get(y); y = parents.get(y) || null; }
      return 0;
    }

    const n = leafNames.length;
    const Dp = Array.from({length:n},()=>Array(n).fill(0));
    // Map name to node - use all leaves for lookup
    const nameToNode = new Map(allLeaves.map(n=>[n.name,n]));

    // Use the exact same order as leafNames (which matches the distance matrix)
    for (let i=0;i<n;i++){
      for (let j=i+1;j<n;j++){
        const a = nameToNode.get(leafNames[i]);
        const b = nameToNode.get(leafNames[j]);
        if (!a || !b) {
          console.warn(`Could not find nodes for ${leafNames[i]} or ${leafNames[j]}`);
          continue;
        }
        const dab = depths.get(a) + depths.get(b) - 2*lcaDepth(a,b);
        Dp[i][j] = Dp[j][i] = dab;
      }
    }
    return Dp;
  }

  function compareMatrices(D, Dp){
    const n = D.length;
    let sse=0, maxAbs=0, mae=0, count=0;
    const residuals = Array.from({length:n},()=>Array(n).fill(0));
    for (let i=0;i<n;i++){
      for (let j=i+1;j<n;j++){
        const r = D[i][j] - Dp[i][j];
        residuals[i][j] = residuals[j][i] = r;
        const a = Math.abs(r);
        sse += r*r; mae += a; count++; if (a>maxAbs) maxAbs=a;
      }
    }
    return {sse, mae: mae/count, maxAbs, residuals};
  }

  // Four-point condition diagnostics for all quartets
  function quartetDiagnostics(D, labels, tol){
    const n = labels.length;
    let ok=0, total=0, maxDev=0;
    function s(i,j){return D[i][j];}
    for (let a=0;a<n;a++){
      for (let b=a+1;b<n;b++){
        for (let c=b+1;c<n;c++){
          for (let d=c+1;d<n;d++){
            total++;
            const s1 = s(a,b)+s(c,d);
            const s2 = s(a,c)+s(b,d);
            const s3 = s(a,d)+s(b,c);
            const arr = [s1,s2,s3].sort((x,y)=>x-y);
            const dev = Math.abs(arr[0]-arr[1]);
            if (dev <= tol) ok++;
            if (dev>maxDev) maxDev=dev;
          }
        }
      }
    }
    return {ok, total, passRate: total? ok/total:1, maxDeviation: maxDev};
  }

  function renderDiagnostics(res, quartet, labels){
    const wrap = document.createElement('div');
    
    // Residuals summary card
    const residualsCard = document.createElement('div');
    residualsCard.className = 'card';
    residualsCard.style.marginBottom = '16px';
    
    const residualsHeader = document.createElement('h4');
    residualsHeader.textContent = 'Residuals vs. Patristic Distances';
    residualsHeader.style.margin = '0 0 12px 0';
    residualsHeader.style.color = 'var(--accent)';
    residualsHeader.style.fontSize = '14px';
    
    const residualsStats = document.createElement('div');
    residualsStats.className = 'row';
    residualsStats.style.gap = '16px';
    residualsStats.innerHTML = `
      <div class="tag">SSE: ${res.sse.toExponential(3)}</div>
      <div class="tag">MAE: ${res.mae.toFixed(6)}</div>
      <div class="tag">Max |residual|: ${res.maxAbs.toFixed(6)}</div>
    `;
    
    residualsCard.appendChild(residualsHeader);
    residualsCard.appendChild(residualsStats);
    
    // Four-point condition summary card
    const fourPointCard = document.createElement('div');
    fourPointCard.className = 'card';
    fourPointCard.style.marginBottom = '16px';
    
    const fourPointHeader = document.createElement('h4');
    fourPointHeader.textContent = 'Four-Point Condition';
    fourPointHeader.style.margin = '0 0 12px 0';
    fourPointHeader.style.color = 'var(--accent)';
    fourPointHeader.style.fontSize = '14px';
    
    const passRate = quartet.passRate * 100;
    const passRateColor = passRate >= 95 ? 'var(--ok)' : passRate >= 80 ? '#fbbf24' : 'var(--bad)';
    
    const fourPointStats = document.createElement('div');
    fourPointStats.className = 'row';
    fourPointStats.style.gap = '16px';
    fourPointStats.innerHTML = `
      <div class="tag">Quartets: ${quartet.ok}/${quartet.total}</div>
      <div class="tag" style="color: ${passRateColor}">Pass Rate: ${passRate.toFixed(1)}%</div>
      <div class="tag">Max Deviation: ${quartet.maxDeviation.toFixed(6)}</div>
    `;
    
    fourPointCard.appendChild(fourPointHeader);
    fourPointCard.appendChild(fourPointStats);
    
    wrap.appendChild(residualsCard);
    wrap.appendChild(fourPointCard);

    // Residuals table with better styling
    const tableCard = document.createElement('div');
    tableCard.className = 'card';
    
    const tableHeader = document.createElement('h4');
    tableHeader.textContent = 'Residuals Matrix';
    tableHeader.style.margin = '0 0 12px 0';
    tableHeader.style.color = 'var(--accent)';
    tableHeader.style.fontSize = '14px';
    
    const tbl = document.createElement('table');
    tbl.style.fontSize = '11px';
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    hr.appendChild(document.createElement('th'));
    for (const l of labels){ 
      const th = document.createElement('th'); 
      th.textContent = l; 
      th.style.fontSize = '10px';
      hr.appendChild(th); 
    }
    thead.appendChild(hr); 
    tbl.appendChild(thead);
    
    const tb = document.createElement('tbody');
    const maxResidual = Math.max(...res.residuals.flat().map(Math.abs));
    
    for (let i=0;i<labels.length;i++){
      const tr = document.createElement('tr');
      const th = document.createElement('th'); 
      th.textContent = labels[i]; 
      th.style.fontSize = '10px';
      tr.appendChild(th);
      
      // Lower triangular matrix: only show j <= i
      for (let j=0; j<=i; j++){
        const td = document.createElement('td');
        const v = res.residuals[i][j];
        
        if (i === j) {
          td.textContent = '0';
          td.style.backgroundColor = '#1a264f';
          td.style.fontWeight = 'bold';
        } else {
          td.textContent = v.toFixed(4);
          const absV = Math.abs(v);
          
          // Color coding based on residual magnitude
          if (absV < 0.001) {
            td.style.backgroundColor = '#0f3f0f'; // Very good (dark green)
            td.style.color = '#86efac';
          } else if (absV < 0.01) {
            td.style.backgroundColor = '#2a2a0f'; // Good (dark yellow)
            td.style.color = '#fbbf24';
          } else {
            td.style.backgroundColor = '#3f0f0f'; // Poor (dark red)
            td.style.color = '#fca5a5';
          }
        }
        tr.appendChild(td);
      }
      
      // Add empty cells for upper triangle
      for (let j = i + 1; j < labels.length; j++){
        const td = document.createElement('td');
        td.style.backgroundColor = '#0b1020';
        td.style.border = 'none';
        tr.appendChild(td);
      }
      
      tb.appendChild(tr);
    }
    tbl.appendChild(tb);
    
    tableCard.appendChild(tableHeader);
    tableCard.appendChild(tbl);

    // Improved help text with legend
    const help = document.createElement('div');
    help.className = 'muted';
    help.style.marginTop = '12px';
    help.innerHTML = `
      <strong>Interpretation:</strong> Residuals = D<sub>observed</sub> - D<sub>patristic</sub> (tree distances). 
      For perfectly additive data, all residuals should be ≈0. <br>
      <span style="color: #86efac">● Green: |residual| < 0.001 (excellent)</span> 
      <span style="color: #fbbf24">● Yellow: |residual| < 0.01 (good)</span> 
      <span style="color: #fca5a5">● Red: |residual| ≥ 0.01 (poor fit)</span><br>
      <strong>Four-point condition:</strong> Tests whether distance data satisfies the tree requirement for all possible quartets.
    `;

    diagEl.replaceChildren(wrap, tableCard, help);
  }

  // === Self tests ===
  function runSelfTests(){
    testsEl.replaceChildren();
    const out = document.createElement('div');

    // Test 1: NJ reconstructs a perfectly additive quartet
    const labels = ['A','B','C','D'];
    // Tree: ((A:1,B:1):2,(C:1,D:1):2);
    const D = [
      [0, 2, 4, 4],
      [2, 0, 4, 4],
      [4, 4, 0, 2],
      [4, 4, 2, 0]
    ];
    const njTree = neighborJoining(D, labels.slice());
    const njDp = computePatristicMatrix(njTree, labels);
    const njRes = compareMatrices(D, njDp);
    const pass1 = njRes.maxAbs < 1e-9;

    // Test 2: UPGMA with ultrametric data
    const upgmaTree = upgma(D, labels.slice());
    const upgmaDp = computePatristicMatrix(upgmaTree, labels);
    const upgmaRes = compareMatrices(D, upgmaDp);
    const pass2 = upgmaRes.maxAbs < 1e-9;

    // Test 3: Four-point violates after perturbation
    const D2 = [
      [0, 2.2, 4, 4],
      [2.2, 0, 4, 4],
      [4, 4, 0, 2],
      [4, 4, 2, 0]
    ];
    const q = quartetDiagnostics(D2, labels, 1e-6);
    const pass3 = q.passRate < 1.0;

    // Test 4: FASTA parser basic
    const parsed = parseFasta('>X\nACGT\n>Y\nAC-T\n');
    const pass4 = parsed.labels.length === 2 && parsed.seqs[0] === 'ACGT' && parsed.seqs[1] === 'AC-T';

    out.innerHTML = ''+
      `<div>Test 1 (NJ additive quartet): <span class="${pass1?'ok':'bad'}">${pass1?'PASS':'FAIL'}</span> (max|res|=${njRes.maxAbs})</div>`+
      `<div>Test 2 (UPGMA ultrametric data): <span class="${pass2?'ok':'bad'}">${pass2?'PASS':'FAIL'}</span> (max|res|=${upgmaRes.maxAbs})</div>`+
      `<div>Test 3 (four-point detects violation): <span class="${pass3?'ok':'bad'}">${pass3?'PASS':'FAIL'}</span> (passRate=${(100*q.passRate).toFixed(1)}%)</div>`+
      `<div>Test 4 (FASTA parser): <span class="${pass4?'ok':'bad'}">${pass4?'PASS':'FAIL'}</span></div>`;

    testsEl.appendChild(out);
  }
})();
